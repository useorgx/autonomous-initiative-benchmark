name: Materialize and verify continuity source
on:
  push:
    branches: [codex/continuity-benchmark-20260922]
    paths: [.github/continuity-hardening.patch]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed hardening changes
        run: |
          git apply --check .github/continuity-hardening.patch
          git apply .github/continuity-hardening.patch
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('schemas/sota-release-manifest.schema.json');s=json.loads(p.read_text())
          for k in ['precisionOutcomeLedgerPath','precisionExpectedCellsPath']: s['properties']['evidence']['properties'][k]={'type':'string','minLength':1}
          p.write_text(json.dumps(s,indent=2)+'\n')
          p=pathlib.Path('schemas/statistical-precision-report.schema.json');s=json.loads(p.read_text());props=s['properties']['cells']['items']['properties']
          props.update({'successes':{'type':'integer','minimum':0},'independent_clusters':{'type':'integer','minimum':1},'estimate':{'type':'number','minimum':0,'maximum':1},'method':{'enum':['wilson_independent_95','cluster_hoeffding_95']}})
          s['properties']['outcome_ledger_sha256']={'type':'string','pattern':'^sha256:[a-f0-9]{64}$'}
          p.write_text(json.dumps(s,indent=2)+'\n')
          p=pathlib.Path('README.md');p.write_text(p.read_text()+'\n## Continuity development experiment\n\nSee [the implementation and evidence boundary](docs/continuity-benchmark-implementation.md). Run `node runner/continuity-benchmark.mjs self-test --out artifacts/continuity/self-test.json` for deterministic checks. Public simulated results do not establish full OrgX performance or human time savings.\n')
          PY
          git diff --check
      - name: Test implementation before committing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuity
          npm test 2>&1 | tee artifacts/continuity/tests.txt
          npm run validate:worlds:preview > artifacts/continuity/preview.txt
          node runner/continuity-benchmark.mjs self-test --out artifacts/continuity/self-test.json
          node runner/continuity-benchmark.mjs plan --out artifacts/continuity/plan.json
      - name: Commit verified final source
        run: |
          git add runner schemas README.md
          git rm .github/continuity-hardening.patch .github/workflows/materialize-continuity-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply verified evidence hardening and strict release recomputation'
          git push origin HEAD:codex/continuity-benchmark-20260922
          git rev-parse HEAD > artifacts/continuity/source-commit.txt
          git archive --format=zip HEAD -o artifacts/continuity/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuity-verified-${{ github.run_id }}
          path: artifacts/continuity
